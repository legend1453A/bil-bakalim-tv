<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kupon & Promosyon Yönetimi - Bil Bakalım TV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=Space+Grotesk:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 10%, #1e1b4b 0%, #090d16 80%);
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .admin-container {
      width: 100%;
      max-width: 840px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .header-card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(12px);
    }
    .title-box h1 {
      font-size: 24px;
      font-weight: 900;
      color: #facc15;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .title-box p {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 4px;
    }
    .btn-tv-link {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #cbd5e1;
      padding: 8px 16px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 13px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-tv-link:hover {
      background: #4f46e5;
      color: #fff;
    }

    .card {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .card-title {
      font-size: 18px;
      font-weight: 800;
      color: #f8fafc;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr auto;
      gap: 12px;
      align-items: end;
    }
    @media (max-width: 640px) {
      .form-grid { grid-template-columns: 1fr; }
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 12px;
      font-weight: 700;
      color: #cbd5e1;
    }
    .form-input {
      background: rgba(2, 6, 23, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus {
      border-color: #facc15;
      box-shadow: 0 0 12px rgba(250, 204, 21, 0.3);
    }

    .btn-create {
      background: linear-gradient(135deg, #10b981, #059669);
      border: none;
      color: #fff;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 900;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
      white-space: nowrap;
      height: 44px;
    }
    .btn-create:hover {
      background: linear-gradient(135deg, #34d399, #10b981);
    }

    /* KUPON TABLOSU */
    .table-container {
      overflow-x: auto;
      margin-top: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th {
      padding: 12px 14px;
      font-size: 12px;
      font-weight: 800;
      color: #94a3b8;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    td {
      padding: 14px;
      font-size: 14px;
      color: #e2e8f0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .code-badge {
      font-family: 'Space Grotesk', monospace;
      font-weight: 900;
      font-size: 15px;
      color: #facc15;
      background: rgba(250, 204, 21, 0.12);
      border: 1px solid rgba(250, 204, 21, 0.4);
      padding: 4px 10px;
      border-radius: 8px;
      display: inline-block;
      letter-spacing: 1px;
    }
    .usage-pill {
      font-size: 12px;
      font-weight: 800;
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid #3b82f6;
      color: #93c5fd;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .btn-del {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-del:hover {
      background: #ef4444;
      color: #fff;
    }

    .toast-box {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #10b981;
      color: #000;
      font-weight: 800;
      padding: 12px 20px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: none;
      z-index: 9999;
    }
  </style>
</head>
<body>

  <div id="toast" class="toast-box">İşlem Başarılı!</div>

  <div class="admin-container">
    <!-- ÜST BİLGİ KARTI -->
    <div class="header-card">
      <div class="title-box">
        <h1>🎟️ Kupon & Promosyon Yönetimi</h1>
        <p>Google Play test kullanıcılarına, ailenize ve kampanya takipçilerinize özel kod üretin.</p>
      </div>
      <a href="/" class="btn-tv-link">📺 TV Ekranına Git ➔</a>
    </div>

    <!-- YENİ KUPON EKLEME FORMU -->
    <div class="card">
      <div class="card-title">➕ Yeni Kupon Oluştur</div>
      <form id="form-create-promo" onsubmit="handleCreatePromo(event)">
        <div class="form-grid">
          <div class="form-group">
            <label>Kupon Kodu (Harf/Rakam):</label>
            <input type="text" id="input-code" class="form-input" placeholder="Örn: TESTER20, AILE50" required style="text-transform:uppercase;">
          </div>
          <div class="form-group">
            <label>Kullanım Sınırı:</label>
            <input type="number" id="input-usage" class="form-input" value="25" min="1" max="9999" required>
          </div>
          <div class="form-group">
            <label>Yetki / Tür:</label>
            <select id="input-type" class="form-input" style="background:#0f172a;">
              <option value="PRO">👑 PRO (Tüm VIP Açık)</option>
            </select>
          </div>
          <button type="submit" class="btn-create">Oluştur ➔</button>
        </div>
      </form>
    </div>

    <!-- AKTİF KUPONLAR TABLOSU -->
    <div class="card">
      <div class="card-title">📋 Sistemdeki Aktif Kuponlar</div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Kupon Kodu</th>
              <th>Kullanım Durumu</th>
              <th>Paket Türü</th>
              <th>Son Kullanma</th>
              <th>İşlem</th>
            </tr>
          </thead>
          <tbody id="promo-table-body">
            <tr><td colspan="5" style="text-align:center; color:#94a3b8;">Yükleniyor...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 3000);
    }

    async function loadPromos() {
      try {
        const res = await fetch('/api/admin/promos');
        const data = await res.json();
        const tbody = document.getElementById('promo-table-body');
        if (!data.success || !data.promos) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#ef4444;">Kuponlar yüklenemedi.</td></tr>';
          return;
        }

        const codes = Object.keys(data.promos);
        if (codes.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#94a3b8;">Kayıtlı aktif kupon bulunmuyor.</td></tr>';
          return;
        }

        tbody.innerHTML = codes.map(code => {
          const item = data.promos[code];
          return `
            <tr>
              <td><span class="code-badge">${code}</span></td>
              <td><span class="usage-pill">${item.usedCount || 0} / ${item.maxUsage} Kullanıldı</span></td>
              <td><span style="font-weight:800; color:#34d399;">👑 ${item.type || 'PRO'}</span></td>
              <td style="color:#94a3b8; font-size:12px;">${item.expiresAt ? item.expiresAt.slice(0, 10) : '2026-12-31'}</td>
              <td>
                <button class="btn-del" onclick="deletePromo('${code}')">Sil ✕</button>
              </td>
            </tr>
          `;
        }).join('');
      } catch (e) {
        console.error(e);
      }
    }

    async function handleCreatePromo(e) {
      e.preventDefault();
      const codeInput = document.getElementById('input-code');
      const usageInput = document.getElementById('input-usage');
      const typeInput = document.getElementById('input-type');

      const code = codeInput.value.trim().toUpperCase();
      const maxUsage = parseInt(usageInput.value) || 25;
      const type = typeInput.value || 'PRO';

      if (!code) return;

      try {
        const res = await fetch('/api/admin/promos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, maxUsage, type })
        });
        const d = await res.json();
        if (d.success) {
          showToast(`"${code}" kuponu başarıyla oluşturuldu! 🎉`);
          codeInput.value = '';
          loadPromos();
        } else {
          alert(d.message || 'Hata oluştu!');
        }
      } catch (err) {
        alert('Sunucu hatası!');
      }
    }

    async function deletePromo(code) {
      if (!confirm(`"${code}" kupon kodunu silmek istediğinize emin misiniz?`)) return;
      try {
        const res = await fetch(`/api/admin/promos/${encodeURIComponent(code)}`, {
          method: 'DELETE'
        });
        const d = await res.json();
        if (d.success) {
          showToast(`"${code}" silindi!`);
          loadPromos();
        }
      } catch (e) {
        alert('Silinemedi!');
      }
    }

    loadPromos();
  </script>
</body>
</html>
