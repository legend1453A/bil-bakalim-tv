<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="tower" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="roof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#sky)"/>
  <circle cx="200" cy="90" r="45" fill="#facc15" opacity="0.15"/>
  <!-- Galata Tower Body -->
  <rect x="160" y="110" width="80" height="150" rx="4" fill="url(#tower)"/>
  <!-- Balcony / Seyir Terası -->
  <rect x="150" y="102" width="100" height="12" rx="3" fill="#334155" stroke="#facc15" stroke-width="2"/>
  <rect x="156" y="80" width="88" height="24" rx="2" fill="url(#tower)"/>
  <!-- Cone Roof -->
  <polygon points="200,20 152,80 248,80" fill="url(#roof)"/>
  <line x1="200" y1="12" x2="200" y2="20" stroke="#facc15" stroke-width="4"/>
  <!-- Windows -->
  <rect x="190" y="130" width="20" height="28" rx="10" fill="#0f172a"/>
  <rect x="190" y="180" width="20" height="28" rx="10" fill="#0f172a"/>
  <rect x="190" y="225" width="20" height="35" rx="3" fill="#0f172a"/>
  <text x="200" y="285" font-family="'Outfit', sans-serif" font-weight="900" font-size="14" fill="#facc15" text-anchor="middle" letter-spacing="1">GÖRSEL SORU: BU TARİHİ KULE HANGİSİDİR?</text>
</svg>
