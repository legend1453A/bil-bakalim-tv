<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="stone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  <!-- Sun / Glory -->
  <circle cx="200" cy="70" r="50" fill="#facc15" opacity="0.12"/>
  <!-- Base steps -->
  <rect x="70" y="210" width="260" height="15" fill="#e2e8f0" rx="2"/>
  <rect x="60" y="225" width="280" height="20" fill="#cbd5e1" rx="2"/>
  <!-- Anıtkabir Main Hall Columns -->
  <rect x="85" y="110" width="230" height="100" fill="#713f12" opacity="0.3"/>
  <!-- Columns (Sütunlar) -->
  <g fill="url(#stone)">
    <rect x="95" y="110" width="14" height="100" rx="2"/>
    <rect x="120" y="110" width="14" height="100" rx="2"/>
    <rect x="145" y="110" width="14" height="100" rx="2"/>
    <rect x="170" y="110" width="14" height="100" rx="2"/>
    <rect x="193" y="110" width="14" height="100" rx="2"/>
    <rect x="216" y="110" width="14" height="100" rx="2"/>
    <rect x="241" y="110" width="14" height="100" rx="2"/>
    <rect x="266" y="110" width="14" height="100" rx="2"/>
    <rect x="291" y="110" width="14" height="100" rx="2"/>
  </g>
  <!-- Entablature / Çatı Alanı -->
  <rect x="80" y="85" width="240" height="25" fill="url(#stone)" rx="2"/>
  <!-- Bayrak -->
  <line x1="340" y1="90" x2="340" y2="225" stroke="#94a3b8" stroke-width="3"/>
  <rect x="340" y="95" width="30" height="20" fill="#ef4444" rx="1"/>
  <circle cx="350" cy="105" r="4" fill="#fff"/>
  <text x="200" y="278" font-family="'Outfit', sans-serif" font-weight="900" font-size="13" fill="#facc15" text-anchor="middle" letter-spacing="1">GÖRSEL SORU: BU ANIT MEZAR NEREDEDİR?</text>
</svg>
